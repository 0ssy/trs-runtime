[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trs-node"
version = "0.1.0"
description = "Network wrapper for TRS runtime reference implementation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111",
  "uvicorn>=0.30",
  "httpx2>=0.22",
]
